<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Research Job Feed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <style>
        body { background-color: #f6f8fa; padding: 40px 0; }
        .card { border-radius: 8px; }
        select { padding: 6px; width: 100%; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold text-dark">Academic Research Openings</h2>
                <p class="text-muted">System Update Timestamp (UTC): 2026-06-12 16:34:34.263917</p>
            </div>
        </div>
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card p-3 shadow-sm border-0 bg-white">
                    <h6 class="fw-bold mb-2 text-secondary">Filter by Country</h6>
                    <select id="countryFilter" class="form-select mb-3">
                        <option value="">All Countries</option>
                    </select>
                    
                    <h6 class="fw-bold mb-2 text-secondary">Filter by Discipline</h6>
                    <select id="disciplineFilter" class="form-select">
                        <option value="">All Disciplines</option>
                    </select>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card p-3 shadow-sm border-0 bg-white">
                    <table id="jobsTable" class="table table-striped table-hover row-border" style="width:100%">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Institution</th>
                                <th>Country</th>
                                <th>Source</th>
                                <th>Discipline</th>
                                <th>Link</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // Inject data from R directly into JavaScript
        const jobsData = [
  {
    "Date": "2026-05-22",
    "Title": "Postdoctoral Fellow in Health Data Science",
    "Institution": "University of Oslo",
    "Country": "Norway",
    "Source": "JobbNorge",
    "Discipline": "Data Science",
    "Link": "<a href='https://www.jobbnorge.no/en/available-jobs/job/259654/postdoctoral-fellow-in-health-data-science' target='_blank' class='btn btn-sm btn-primary fw-bold'>Apply ↗<\/a>"
  },
  {
    "Date": "2026-05-22",
    "Title": "Assistant Professor in Political Science",
    "Institution": "University of Copenhagen",
    "Country": "Denmark",
    "Source": "Academic Positions",
    "Discipline": "Political Science",
    "Link": "<a href='https://academicpositions.com/ad/university-of-copenhagen/2026/assistant-professor/198422' target='_blank' class='btn btn-sm btn-primary fw-bold'>Apply ↗<\/a>"
  },
  {
    "Date": "2026-05-22",
    "Title": "Research Fellow in Computational Linguistics",
    "Institution": "University of Edinburgh",
    "Country": "United Kingdom",
    "Source": "jobs.ac.uk",
    "Discipline": "Computational Science",
    "Link": "<a href='https://www.jobs.ac.uk/job/DGE512/research-fellow-in-computational-linguistics' target='_blank' class='btn btn-sm btn-primary fw-bold'>Apply ↗<\/a>"
  },
  {
    "Date": "2026-05-22",
    "Title": "Postdoctoral Associate in Policy Research",
    "Institution": "Duke University",
    "Country": "United States",
    "Source": "HigherEdJobs",
    "Discipline": "Public Policy",
    "Link": "<a href='https://www.higheredjobs.com/details.cfm?JobCode=178654321' target='_blank' class='btn btn-sm btn-primary fw-bold'>Apply ↗<\/a>"
  }
];

        $(document).ready(function() {
            // Initialize DataTables
            const table = $("#jobsTable").DataTable({
                data: jobsData,
                columns: [
                    { data: "Date" },
                    { data: "Title" },
                    { data: "Institution" },
                    { data: "Country" },
                    { data: "Source" },
                    { data: "Discipline" },
                    { data: "Link", orderable: false }
                ],
                pageLength: 10,
                dom: "ftp"
            });

            // Dynamically populate the sidebar dropdown filters
            const countries = [...new Set(jobsData.map(item => item.Country))].sort();
            countries.forEach(c => {
                if(c) $("#countryFilter").append(`<option value="${c}">${c}</option>`);
            });

            const disciplines = [...new Set(jobsData.map(item => item.Discipline))].sort();
            disciplines.forEach(d => {
                if(d) $("#disciplineFilter").append(`<option value="${d}">${d}</option>`);
            });

            // Link dropdown behaviors to the DataTable filtering logic
            $("#countryFilter").on("change", function() {
                table.column(3).search(this.value).draw();
            });
            $("#disciplineFilter").on("change", function() {
                table.column(5).search(this.value).draw();
            });
        });
    </script>
</body>
</html>
