name: Run Scraper and Build Dashboard

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows you to click a button to run it manually anytime
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::jsonlite

      - name: Run Scraper Pipeline
        run: |
          # This executes your main script which imports R/04_dashboard.R
          Rscript main.R

      - name: Commit and Push Updated Dashboard
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_feed.csv index.html
          git commit -m "Automated update: $(date -u)" || echo "No changes to commit"
          git push
