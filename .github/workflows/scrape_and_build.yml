name: Run Scraper and Build Dashboard

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows you to click a button to run it manually anytime
  push:
    branches:
      - main

# Grant permissions to write data and deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::jsonlite

      - name: Run Scraper Pipeline
        run: |
          Rscript main.R

      - name: Commit Updated Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_feed.csv index.html
          git commit -m "Automated update: $(date -u)" || echo "No changes to commit"
          git push

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything from root, including your new index.html

      - name: Force Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
